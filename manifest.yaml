apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: roboshop
  labels:
    project: roboshop
    tier: db
    component: mysql
spec:
  replicas: 1
  selector:
    matchLabels:
      project: roboshop
      tier: db
      component: mysql
  template:
    metadata:
      labels:
        project: roboshop
        tier: db
        component: mysql
    spec:
      serviceAccountName: roboshop-mysql
      initcontainers:
      - name: secret-reader
        image: amazon/aws-cli 
        command:
        - sh
        - -c
        - |
            aws secretsmanager get-secret-value \
            --secret-id roboshop/mysql \
            --query SecretString \
            --output text | jq -r '.mysql_root_password' > /secrets/mysql-secret.txt
            echo "Secret fetched successfully"
            cat /secrets/mysql-secret.txt
        volumemounts:
        - name: mysql-secret
          mountPath: /secrets
      containers:
      - name: mysql
        image: pandu15/mysql:5.0.0
        args: ["--mysql-native-password=ON"]
        volumemounts:
        - name: mysql-secret
          mountPath: /secrets
      volumes:
      - name: mysql-secret
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: roboshop
  # servicer labels
  labels:
    project: roboshop
    environment: dev
spec:
# service uses the below labels to select the pods
  selector:
    project: roboshop
    tier: db
    component: mysql
  ports:
   - protocol: TCP
     port: 3306 # service port
     targetPort: 3306 # container port
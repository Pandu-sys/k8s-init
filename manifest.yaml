apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: roboshop
  labels:
    project: roboshop
    tier: db
    component: mysql

spec:
  replicas: 1

  selector:
    matchLabels:
      project: roboshop
      tier: db
      component: mysql

  template:
    metadata:
      labels:
        project: roboshop
        tier: db
        component: mysql

    spec:
      serviceAccountName: roboshop-mysql

      initContainers:
        - name: secret-reader
          image: amazon/aws-cli:latest

          command:
            - /bin/sh
            - -c

          args:
            - |
              echo "Fetching MySQL password..."

              aws secretsmanager get-secret-value \
                --secret-id roboshop/mysql \
                --query SecretString \
                --output text | \
                jq -r '.mysql_root_password' > /secrets/mysql-secret.txt

              if [ ! -s /secrets/mysql-secret.txt ]; then
                echo "Password file is empty!"
                exit 1
              fi

              echo "Secret fetched successfully"

              # Remove this line after testing.
              cat /secrets/mysql-secret.txt

          volumeMounts:
            - name: mysql-secret
              mountPath: /secrets

      containers:
        - name: mysql
          image: pandu15/mysql:5.0.0

          args:
            - "--mysql-native-password=ON"

          volumeMounts:
            - name: mysql-secret
              mountPath: /secrets

          ports:
            - containerPort: 3306
              protocol: TCP

      volumes:
        - name: mysql-secret
          emptyDir: {}